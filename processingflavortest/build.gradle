plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'processing-flavor-plugin'
}

android {
    namespace 'com.chenyihong.processingflavortest'
    compileSdk 34

    defaultConfig {
        applicationId "com.chenyihong.processingflavortest"
        minSdk 23
        targetSdk 34

        multiDexEnabled true
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig null
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig null
        }
    }

    buildFeatures {
        viewBinding = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

ProcessingFlavorExtension {

    executeCommand = COMMAND_ASSEMBLE

    buildType = BUILD_TYPE_DEBUG

    packagingFlavor = ["plugintesta", "plugintestb"]
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}